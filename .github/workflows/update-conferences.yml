name: Update conferences
on:
  schedule:
    - cron: '13 1 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: conference-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test conference collector
        run: python -m unittest discover -s scripts -p test_conference_feed.py
      - name: Collect conferences
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/update_conference_feed.py
      - name: Save successful update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/conferences-display.json pages-v2/konferensi/conferences.json pages-v2/konferensi/review.json pages-v2/konferensi/01-conferences-wordpress.html pages-v2/konferensi/preview.html pages-v2/konferensi/conference-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh conference contributions'
          git status --short
          git pull --rebase --autostash
          git push
